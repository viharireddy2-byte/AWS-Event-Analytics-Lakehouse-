version: 2
models:
  - name: stg_raw_events
    description: "Aurora staging contract; invalid source rows are never silently filtered."
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['page_view', 'click', 'purchase', 'signup', 'login', 'logout']
      - name: event_timestamp
        tests:
          - not_null
  - name: stg_raw_users
    description: "Aurora staging contract; invalid source rows are never silently filtered."
    columns:
      - name: user_id
        tests:
          - not_null
          - unique
      - name: username
        tests:
          - not_null
      - name: email
        tests:
          - not_null
          - unique
